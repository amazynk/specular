name: Bug report
description: Something doesn't work, crashes, or a file won't open
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security problems, use [private reporting](https://github.com/amazynk/specular/security/advisories/new) instead.
  - type: checkboxes
    id: searched
    attributes:
      label: Before you open this
      options:
        - label: I searched the existing issues and this isn't one of them.
          required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Press …
  - type: input
    id: version
    attributes:
      label: Specular version
      description: Shown in the About window
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: input
    id: os-details
    attributes:
      label: OS version and GPU
      placeholder: e.g. macOS 15.2, M3 Max · Windows 11 24H2, RTX 4070 · Fedora 41, Wayland, Radeon 780M
  - type: textarea
    id: files
    attributes:
      label: Sample file or diagnostics
      description: Attach the file that fails (or a small one that fails the same way), or a diagnostics bundle ("Save diagnostics bundle…" in the command palette or the About window). Only share files you're allowed to.

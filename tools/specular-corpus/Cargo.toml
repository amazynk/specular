[package]
name = "specular-corpus"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Generates the Specular JPEG test corpus (photo-like procedural content, metadata, broken files)"

[dependencies]
specular-thread = { path = "../../crates/specular-thread" }
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }

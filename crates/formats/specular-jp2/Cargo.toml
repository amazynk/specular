[package]
name = "specular-jp2"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Fast JPEG 2000 decoder for Specular: JP2/J2K/JPH, JPX layers, JPM pages, reduced-resolution and region decode, tile- and code-block-parallel"

[dependencies]
specular-core = { path = "../../specular-core" }
specular-thread = { path = "../../specular-thread", features = ["rayon"] }
rayon = "1.11"
thiserror = "2"

[dev-dependencies]
# Pure-Rust oracle for in-process comparisons (tests/benches only).
hayro-jpeg2000 = { version = "0.3", default-features = false, features = ["std", "simd"] }

[lints]
workspace = true

[package]
name = "specular-pcb"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Own readers for electronics files: Gerber RS-274X with X2/X3 attributes, Excellon drill files, a board's Gerber set as a layer stack with board colours; into specular-vector scenes"

[dependencies]
specular-vector = { path = "../../specular-vector" }
thiserror = "2"
# IPC-2581 (XML).
roxmltree = "0.21"

[dev-dependencies]
serde_json = "1"  # the oracle's expectations (tests/oracle.rs)
specular-png = { path = "../specular-png" }  # gzip of ODB++ .tgz jobs (tests/engineering_corpus.rs)

[lints]
workspace = true

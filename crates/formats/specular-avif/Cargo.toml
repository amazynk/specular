[package]
name = "specular-avif"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "AVIF decoding for Specular: own HEIF/ISOBMFF parser (stills, grids, alpha, AVIS sequences) over a safe rav1d (Rust dav1d port) AV1 backend, with fused scaled 8-bit output"

[features]
default = []
# Enable rav1d's hand-written x86/ARM assembly (much faster; needs `nasm` at build time).
asm = ["rav1d/asm"]

[dependencies]
rayon = "1.11"
# In-tree fork of re_rav1d 0.1.3 (BSD-2-Clause) without the unmaintained `paste` dependency.
rav1d = { package = "specular-rav1d", path = "rav1d", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
thiserror = "2"

[lints]
workspace = true

# In-tree fork of re_rav1d 0.1.3 (rav1d, the Rust port of dav1d; BSD-2-Clause, see COPYING and
# NOTICE). Changes: the `paste` proc-macro dependency (unmaintained, RUSTSEC-2024-0436) is
# removed; staticlib output dropped; worker threads named `dec-av1-N`. Everything else is
# upstream.
[package]
name = "specular-rav1d"
version = "0.1.3"
edition = "2021"
license = "BSD-2-Clause"
publish = false
description = "Fork of re_rav1d 0.1.3 (Rust port of the dav1d AV1 decoder) without the paste dependency"
build = "build.rs"
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "rav1d"
path = "lib.rs"
# Upstream code: not held to the workspace lints; keep builds of dependents warning-free.
doctest = false
test = false

[dependencies]
assert_matches = "1.5.0"
atomig = { version = "0.4.0", features = ["derive"] }
av-data = "0.4.2"
bitflags = "2.4.0"
cfg-if = "1.0.0"
libc = "0.2"
parking_lot = "0.12.2"
raw-cpuid = "11.0.1"
static_assertions = "1"
strum = { version = "0.26", features = ["derive"] }
to_method = "1.1.0"
zerocopy = { version = "0.7.32", features = ["derive"] }

[build-dependencies]
cc = "1.0.79"
nasm-rs = { version = "0.3", features = ["parallel"] }

[features]
default = ["bitdepth_8", "bitdepth_16"]
asm = []
asm_arm64_dotprod = ["asm"]
asm_arm64_i8mm = ["asm"]
bitdepth_8 = []
bitdepth_16 = []

[lints.rust]
warnings = "allow"

[lints.clippy]
all = "allow"

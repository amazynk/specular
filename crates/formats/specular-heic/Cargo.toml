[package]
name = "specular-heic"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "HEIC/HEIF decoding for Specular: per-tile driver over in-tree forks of oxideav-heif (container) and the HEVC decoders, with AVC, JPEG and uncompressed items"

[dependencies]
h265 = { package = "specular-h265", path = "h265" }
heif = { package = "specular-heif", path = "heif" }
hevc = { package = "specular-hevc", path = "hevc" }
miniz_oxide = "0.8"
specular-brotli = { path = "../specular-brotli" }
specular-core = { path = "../../specular-core" }
specular-h264 = { path = "../specular-h264" }
specular-vvc = { path = "../specular-vvc" }
specular-jpeg = { path = "../specular-jpeg" }
rayon = "1.11"
thiserror = "2"

[dev-dependencies]
png = "0.18"

[lints]
workspace = true

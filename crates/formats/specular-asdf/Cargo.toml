[package]
name = "specular-asdf"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "ASDF (Advanced Scientific Data Format) 1.x for Specular: a bounded YAML subset reader for the tree, binary blocks (zlib, bzip2 and LZ4 compressed, block index, streamed blocks), and ndarrays (8 to 64-bit integers, float16/32/64, bool and complex, both byte orders, strides and offsets, inline data, external files)"

[dependencies]
# Decompressed blocks reserve from the memory budget.
specular-core = { path = "../../specular-core" }
thiserror = "2"
# Own decoders for the block compressions: zlib (inflate), bzip2, LZ4 (ASDF's chunked blocks).
specular-png = { path = "../specular-png" }
specular-xcf = { path = "../specular-xcf" }
specular-hdf5 = { path = "../specular-hdf5" }
# Block checksums, verified on request only (RustCrypto).
md-5 = { version = "0.10", default-features = false }

[lints]
workspace = true

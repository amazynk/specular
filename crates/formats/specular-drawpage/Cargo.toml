[package]
name = "specular-drawpage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Page display lists for office and design drawings (Visio, OpenDocument Graphics, WordPerfect Graphics, Sketch): fills, strokes, gradients, images, clips, opacity groups and wrapped text boxes, drawn with vello_cpu and the drawing stack's fonts"

[dependencies]
# The nesting pre-scan in front of roxmltree, which recurses per element.
specular-limits = { path = "../../specular-limits" }
# The CPU rasteriser hayro (PDF) already brings in, with the same features.
vello_cpu = { version = "0.3", default-features = false, features = ["std", "png", "u8_pipeline"] }
kurbo = "0.13"
# Text: the drawing stack's fonts (system fonts with metric twins, bundled Inter fallback).
specular-vector = { path = "../../specular-vector" }
# Bounded DOM parsing for the XML formats (VSDX, ODG, Sketch's none).
roxmltree = "0.21"
thiserror = "2"

[dev-dependencies]
specular-thread = { path = "../../specular-thread" }  # small-stack hostile tests

[lints]
workspace = true

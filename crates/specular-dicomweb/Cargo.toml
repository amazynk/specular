[package]
name = "specular-dicomweb"
description = "DICOMweb client for Specular: QIDO-RS search, WADO-RS retrieval (multipart, frames, bulk data, metadata, rendered) and progressive series loading"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true

[dependencies]
specular-thread = { path = "../specular-thread" }
specular-core = { path = "../specular-core" }
specular-log = { path = "../specular-log" }
specular-remote = { path = "../specular-remote" }
specular-dicom = { path = "../formats/specular-dicom" }
# C-FIND for DIMSE servers (the same search form as QIDO).
specular-dimse = { path = "../specular-dimse" }
# Synthetic rendered previews from the fake server.
specular-png = { path = "../formats/specular-png" }
serde_json = "1"
memchr = "2"
# STOW-RS responses in the Native DICOM Model XML.
roxmltree = "0.21"
parking_lot = "0.12"

[lints]
workspace = true

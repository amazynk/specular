# Text in images (OCR): PaddleOCR's text detector and line recognisers (Apache-2.0; training
# data not named, terms not stated) run by specular-infer (specular_infer::ocr), and
# Tesseract's LSTM (tessdata_best, Apache-2.0; synthetic lines rendered by Google, terms not
# stated) for Hebrew, which no PaddleOCR model reads. Each Paddle model is three files from
# its Hugging Face safetensors export: the weights (converted to f16 here), config.json (the
# architecture) and preprocessor_config.json (the character list). The detector is shared by
# both sizes; the script recognisers are add-ons installed beside a size.
#
#   small     PP-OCRv6 tiny   detector 9.9 MB + recogniser 4.5 MB (Chinese and Latin script)
#   standard  PP-OCRv6 small  detector 9.9 MB + recogniser 21 MB (Chinese, Japanese, Latin)
#   both      PP-OCRv5 mobile detector 14 MB (used where v6 can't run on the GPU: on the CPU
#             it is about a quarter faster) and PP-LCNet x1.0 text-line orientation 6.8 MB
#             (upside-down lines turned before reading)
#   add-ons   PP-OCRv5 mobile recognisers (22-28 MB each), Tesseract Hebrew (3.7 MB)

[[model]]
feature = "text"
tier = ["small", "standard"]
id = "ppocrv6-small-det"
version = "1"
role = "detector"
urls = ["https://huggingface.co/PaddlePaddle/PP-OCRv6_small_det_safetensors/resolve/eae2ee920a39fb3087637d3dbb58df1896ec1f24/model.safetensors"]

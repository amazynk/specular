# Models the Local AI pack offers (DESIGN.md "Local AI pack").
#
# Nothing here downloads by default. Per feature the user
# picks which model to download and use in the model manager (Settings › Local AI); each
# offer shows its size, licence, training data (and whether its terms are stated) and the
# host it comes from. A feature's models fill up to three slots (tiers: small, standard,
# large; the files of one slot install together, a file several slots share lists them
# all), or are add-ons beside it (OCR script packs). Every URL is pinned to a commit; sha256
# and size are of that file, checked on download.
#
# The format (specular_ai::manifest), one [[model]] table per file to download:
#
#   schema = 3
#
#   [[model]]
#   feature     = "search"          # search | text | culling | people | speech | masks |
#                                   # denoise | remove | depth
#   tier        = "standard"        # small | standard | large, or an array of them
#   id          = "example-embed"   # [a-z0-9._-], unique in the manifest
#   version     = "1"
#   role        = "image-encoder"   # what the feature uses it for
#   urls        = ["https://…"]     # mirrors, tried in order (https:// only; file:// for tests)
#   sha256      = "<64 hex digits>"
#   size        = 123456789         # bytes
#   licence     = "Apache-2.0"      # SPDX expression
#   licence_url = "https://…"
#   placeholder = false             # true: a format example, never offered to users
#
#   [model.runtime]
#   format           = "safetensors" # file format downloaded (spm: a SentencePiece model;
#                                    # txt: BPE merges; pt: a PyTorch checkpoint, converted)
#   arch             = "siglip"      # network family the runtime builds: siglip | pecore
#   min_memory_mb    = 512           # memory the loaded model needs
#   gpu              = "optional"    # required | optional | none
#   input            = 256           # thumbnail side the model takes (pixels)
#   dims             = 768           # embedding size, for models that give one
#   norm             = "inception"   # input normalisation: openai | inception
#   mmacs            = 23409         # millions of multiply-adds per photo
#   convert          = "f16"         # converted after the hash check, original deleted
#   converted_sha256 = "<64 hex>"    # the converted file's hash, when pinned
#
# and one [[choice]] per model the user can pick (what the model manager shows):
#
#   [[choice]]
#   feature    = "search"
#   tier       = "large"            # its slot; or addon = "<id>" for an add-on
#   name       = "SigLIP 2 B/16"    # the model's own name, shown as it is
#   default    = true               # the feature's default (one per feature)
#   languages  = "multilingual"     # multilingual | english | a script id (OCR)
#   hint       = "faster"           # optional: faster | closed-eyes | small-faces
#   data       = "WebLI"            # training data as the publisher names it ("" unnamed)
#   data_terms = "unstated"         # unstated | stated | research (research-only datasets)
#   coming     = true               # shown, not installable yet (a later lane runs it)
#   size, licence, licence_url, host  # a coming choice only (an available one's come from
#                                     # its models); size is approximate until pinned
#
# Search: SigLIP 2 image-text encoders (google/siglip2-base-*, Apache-2.0; WebLI, terms not
# stated), run by specular-infer (specular_infer::siglip), with the Gemma SentencePiece
# tokenizer shipped in the same Apache-2.0 repo (treated as
# Apache-2.0). The f32 download (1.5 GB) is converted to f16 on this computer (about
# 755 MB) and the original deleted. Meta's PE Core S16 (facebook/PE-Core-S16-384,
# Apache-2.0; training data not named), English only, run by specular_infer::pecore: its
# PyTorch checkpoint is read without running code (specular_infer::pt) and converted to an
# f16 safetensors file (176 MB); CLIP's BPE merges come from timm's Apache-2.0 copy of the
# model (the same merges Meta's code ships).
#
#   small     SigLIP 2 B/32 at 256 px      1,507 MB download    5.7 GMACs / photo
#   standard  PE Core S16 at 384 px          349 MB download   15.7 GMACs / photo, English
#   large     SigLIP 2 B/16 at 256 px      1,501 MB download   23.4 GMACs / photo (default)

schema = 3

[[model]]
feature = "search"
tier = ["small", "large"]
id = "gemma-sentencepiece"
version = "1"
role = "tokenizer"
urls = ["https://huggingface.co/google/siglip2-base-patch16-256/resolve/3f9f96cb90da5dbc758b01813f2f6f1aee24c1ab/tokenizer.model"]
sha256 = "61a7b147390c64585d6c3543dd6fc636906c9af3865a5548f27f31aee1d4c8e2"
